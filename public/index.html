<style>
/* Sora, the brand typeface (SIL Open Font License), served by Bunny Fonts: EU-hosted, no cookies, no IP logging. */
@font-face {
  font-family: "Sora";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(https://fonts.bunny.net/sora/files/sora-latin-400-normal.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Sora";
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url(https://fonts.bunny.net/sora/files/sora-latin-600-normal.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
  /* Brand palette (logo kit v1) */
  --ink: #0A1C22;
  --paper: #EFF5F5;
  --petrol: #0E6E85;
  --petrol-light: #4CC9E0;

  --bg: var(--paper);
  --fg: var(--ink);
  --muted: #47606A;
  --line: #CFDDE0;
  --accent: var(--petrol);

  --font: "Sora", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --gutter: clamp(1.25rem, 6vw, 4rem);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--ink);
    --fg: var(--paper);
    --muted: #9DB3B9;
    --line: #1C343C;
    --accent: var(--petrol-light);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, p { margin: 0; }
a { color: inherit; }

::selection { background: var(--accent); color: var(--bg); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
  border-radius: 2px;
}

.wrap {
  width: 100%;
  max-width: 74rem;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

main {
  display: grid;
  align-items: center;
}
main .wrap { padding-block: clamp(4rem, 14vh, 9rem); }

.logo { color: var(--fg); }
.logo svg {
  display: block;
  width: clamp(14rem, 46vw, 28rem);
  height: auto;
}
.sq { fill: var(--accent); }

.lead {
  max-width: 30em;
  margin-top: clamp(1.75rem, 4.5vw, 3rem);
  color: var(--muted);
  font-size: clamp(1.25rem, 2.2vw, 1.625rem);
  line-height: 1.4;
  letter-spacing: -.01em;
}

.email {
  display: inline-block;
  margin-top: 1rem;
  font-size: clamp(1.25rem, 2.4vw, 1.75rem);
  font-weight: 600;
  letter-spacing: -.02em;
  text-decoration: underline;
  text-decoration-color: var(--accent);
  text-decoration-thickness: 2px;
  text-underline-offset: .3em;
  transition: color .15s ease;
}
.email:hover { color: var(--accent); }
</style>
